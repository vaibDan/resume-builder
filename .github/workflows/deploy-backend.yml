name: Deploy Backend

on:
  push:
    branches: [Main]
    paths:
      - 'apps/backend/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: resume-builder
  ECR_REPO: resume-builder/backend

jobs:
  build-and-push:
    name: Build & Push Backend to ECR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag & push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE=$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG

          docker build -t $IMAGE ./apps/backend
          docker push $IMAGE

          docker tag $IMAGE $ECR_REGISTRY/$ECR_REPO:latest
          docker push $ECR_REGISTRY/$ECR_REPO:latest

          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Summary
        run: echo "### Backend image pushed ${{ steps.build.outputs.image }}" >> $GITHUB_STEP_SUMMARY

  test:
    name: Health check after deploy
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      - name: Run health check
        run: |
          ALB=$(kubectl get ingress resume-builder-ingress \
            -n resume-builder \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          echo "Hitting http://$ALB/api/health ..."

          # Retry up to 5 times with 10s delay
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done

          echo "Health check failed after 5 attempts"
          exit 1

  deploy:
    name: Deploy Backend to EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      - name: Apply configmap (in case ALLOWED_ORIGINS changed)
        run: kubectl apply -f infra/k8s/configmap.yml

      - name: Update backend deployment image
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          kubectl set image deployment/resume-server \
            backend=$IMAGE \
            -n resume-builder

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/resume-server \
            -n resume-builder \
            --timeout=120s

      - name: Summary
        run: |
          echo "### Backend deployed to EKS" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ needs.build-and-push.outputs.image }}" >> $GITHUB_STEP_SUMMARY