apiVersion: v1
kind: Service
metadata:
  name: resume-server
  namespace: resume-builder
spec:
  type: ClusterIP
  selector:
    app: resume-server
  ports:
  - port: 3000
    targetPort: 3000  

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-server
  namespace: resume-builder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resume-server
  template:
    metadata:
      labels:
        app: resume-server
    spec:
      containers:
      - name: server
        image: vaibdan/resume-server:latest
        imagePullPolicy: Always 
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: resume-config
        env:
        - name: MONGO_DB_URI
          valueFrom:
            secretKeyRef:
              name: resume-secrets
              key: MONGO_DB_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: resume-secrets
              key: JWT_SECRET
        - name: IMAGEKIT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: resume-secrets
              key: IMAGEKIT_PUBLIC_KEY
        - name: IMAGEKIT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: resume-secrets
              key: IMAGEKIT_PRIVATE_KEY
        - name: IMAGEKIT_URL_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: resume-secrets
              key: IMAGEKIT_URL_ENDPOINT
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: resume-secrets
              key: OPENAI_API_KEY
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5