# ---------------------------------------------------------------
# Frontend — React + Nginx
# Replace <AWS_ACCOUNT_ID> with your actual account ID
# ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-client
  namespace: resume-builder
  labels:
    app: resume-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resume-client
  template:
    metadata:
      labels:
        app: resume-client
    spec:
      containers:
        - name: resume-client
          # Updated from kind local image → ECR
          image: 476114113057.dkr.ecr.us-east-1.amazonaws.com/resume-builder/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
# ClusterIP — ALB Ingress routes external traffic here
apiVersion: v1
kind: Service
metadata:
  name: resume-client
  namespace: resume-builder
spec:
  selector:
    app: resume-client
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
